name: Entrenamiento diario Fresh Analytics

on:
  schedule:
    # RNF-04: el modelo debe amanecer actualizado (antes de las 6:00 AM en
    # Guatemala, UTC-6). GitHub atrasa las tareas programadas cuando sus
    # servidores estan cargados (del 4 al 12 de octubre de 2026 la corrida
    # de las 6:00 arranco entre 4 y 8 horas tarde), sobre todo las que caen
    # en una hora en punto. Por eso se usan minutos "raros" y tres intentos
    # en la madrugada. Correrlo mas de una vez es seguro: cada paso del
    # pipeline esta hecho para no duplicar ventas, predicciones ni alertas.
    - cron: "17 6 * * *"    # 00:17 AM Guatemala
    - cron: "47 8 * * *"    # 02:47 AM Guatemala
    - cron: "37 10 * * *"   # 04:37 AM Guatemala
  workflow_dispatch:
    # Permite correrlo manualmente desde la pestaña "Actions" de GitHub,
    # util para probar sin esperar hasta el dia siguiente.

# Si dos intentos atrasados coinciden, el segundo espera a que termine el
# primero (nunca corren dos entrenamientos al mismo tiempo).
concurrency:
  group: entrenamiento-diario
  cancel-in-progress: false

jobs:
  entrenar:
    # Version fija: "ubuntu-latest" cambia a Ubuntu 26 a partir del 19 de
    # octubre de 2026. Se fija 24.04 para no cambiar el entorno sin probarlo.
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Cachear cmdstan (motor de Prophet - evita recompilarlo cada día)
        uses: actions/cache@v5
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-cmdstanpy-1.3.0

      - name: Instalar dependencias (incluye Prophet)
        run: pip install -r requirements.txt

      - name: Actualizar historial de ventas (mantiene vivo el pronóstico)
        run: python manage.py actualizar_historial_ventas

      - name: Entrenar modelo Prophet (RF-03)
        run: python manage.py entrenar_modelo

      - name: Generar alertas (RF-05 / DFD P-07)
        run: python manage.py generar_alertas
