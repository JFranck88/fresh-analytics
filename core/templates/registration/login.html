{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fresh Analytics - Iniciar sesión</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'core/img/logo.svg' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'core/css/estilo.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card" style="width: 100%; max-width: 380px;">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <img src="{% static 'core/img/logo.svg' %}" alt="Fresh Analytics" style="width: 56px; height: 56px; margin-bottom: 12px;">
                    <h4 class="mb-1" style="font-weight: 700;">
                        <span style="color: var(--bosque);">Fresh</span><span style="color: var(--brote);">Analytics</span>
                    </h4>
                    <p class="text-muted mb-0" style="font-size: 14px;">Departamento de perecederos</p>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger py-2">
                        Correo o contraseña incorrectos.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Correo</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        {{ form.password }}
                    </div>
                   <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
