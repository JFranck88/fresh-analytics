{% extends "base.html" %}
{% block content %}
<div style="max-width: 500px;">
    <h5 class="mb-3">Registrar merma</h5>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3"><label class="form-label">Producto</label>{{ form.producto }}</div>
        <div class="mb-3"><label class="form-label">Fecha</label>{{ form.fecha }}</div>
        <div class="mb-3"><label class="form-label">Cantidad</label>{{ form.cantidad }}</div>
        <div class="mb-3"><label class="form-label">Motivo</label>{{ form.motivo }}</div>
        <div class="mb-3"><label class="form-label">Costo de la pérdida (Q)</label>{{ form.costo_perdida }}</div>
        <button type="submit" class="btn btn-primary w-100">Registrar merma</button>
    </form>
</div>
{% endblock %}
