<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fresh Analytics - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">Fresh Analytics</span>
            <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="alert alert-success">
            Bienvenido, <strong>{{ usuario.nombre }}</strong> — Rol: <strong>{{ usuario.rol }}</strong>
        </div>
        <p class="text-muted">
            Este es un dashboard de prueba. El login con roles (RF-01) ya está
            funcionando de extremo a extremo: PostgreSQL real → Django →
            navegador.
        </p>
    </div>
</body>
</html>
